name: Android checks and APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-alpha]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-alpha' }}
          COMMIT: ${{ github.sha }}
        run: |
          mv apk/app-debug.apk apk/LANU-Yalanini-Seveyim-${TAG}-arm64-test.apk
          sha256sum apk/*.apk > apk/SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          İlk Android test sürümü: cihaz içi Qwen3.5 4B, 100 seviye, beş soruluk turlar, AI puanlama, şifreli ilerleme ve özgün LANU maskotu.

          İlk açılışta yaklaşık 2,74 GB model indirilir. Model indirildikten sonra çevrimdışı oynanır. Fiziksel Samsung A55 testi henüz yapılmadı; yanıt hızı ve Türkçe mizah kalitesi cihazda doğrulanmalıdır.

          Bu APK debug/test imzalıdır. Kalıcı üretim imzası yapılandırılmadığı için sonraki test APK'larına yerinde güncelleme garantisi yoktur. Üretim sürümü ve OTA henüz hazır değildir.
          NOTES
          gh release create "$TAG" apk/* --repo "$REPO" --title "LANU $TAG · Android test sürümü" --notes-file notes.md --prerelease --target "$COMMIT"
