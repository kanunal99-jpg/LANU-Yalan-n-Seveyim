name: Android checks and APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LANU_STORE_PASSWORD: ${{ secrets.LANU_STORE_PASSWORD }}
      LANU_KEY_ALIAS: ${{ secrets.LANU_KEY_ALIAS }}
      LANU_KEY_PASSWORD: ${{ secrets.LANU_KEY_PASSWORD }}
      LANU_CERT_SHA256: ${{ secrets.LANU_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare existing permanent key when configured
        env:
          LANU_KEYSTORE_BASE64: ${{ secrets.LANU_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_ci_signing.py
      - name: Exercise missing, partial and mismatched signing safeguards
        run: python3 scripts/signing_guard_smoke.py
      - name: Test, lint and build
        run: ./gradlew -Planu.requireProductionSigning=${LANU_REQUIRE_SIGNING:-false} testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Build same-signature OTA pair
        run: |
          mkdir -p release-packages/v0.8.0-alpha release-packages/v0.8.1-alpha
          cp app/build/outputs/apk/debug/app-debug.apk release-packages/v0.8.0-alpha/LANU-Yalanini-Seveyim-v0.8.0-alpha-arm64-test.apk
          ./gradlew -Planu.requireProductionSigning=${LANU_REQUIRE_SIGNING:-false} -Planu.versionCode=14 -Planu.versionName=0.8.1-alpha assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk release-packages/v0.8.1-alpha/LANU-Yalanini-Seveyim-v0.8.1-alpha-arm64-test.apk
          python3 scripts/release_packages.py
          for apk in release-packages/*/*.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"; done
      - uses: actions/upload-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: release-packages/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/story-quality
            app/build/reports/ai-quality
            app/build/reports/signing-guard
            app/build/test-results
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AOSP UI smoke without Google services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test -z "$(adb shell pm path com.google.android.gms | tr -d '\r')"
            adb shell settings put system font_scale 1.3
            bash scripts/ota_emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-ui-smoke-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/reports/ota-upgrade
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-alpha]'))
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: apk
      - name: Publish verified base and OTA update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          LANU 0.8 alpha: beş bağımsız aktif konu, Konularım penceresi ve her hikâyeye ayrı şifreli cevap taslağı eklendi. Hikâye değişmeden önce taslak kaydedilir; depolama hatasında geçiş durur ve cevap ekranda korunur. Beş konu doluyken altıncı konu açılmaz; hikâye yalnız açık kapatma onayıyla silinir. Tamamlanan hikâye sonraki konuya geçişte yerini bırakır; kazanılan seviye ve en iyi puanlar kalır. Yedek ve gerçek paket yükseltme testleri beş hikâyeyi kapsar.

          Önceki isteğe bağlı Ücretsiz çevrimiçi AI korunur. OpenRouter kişisel anahtarını uygulamada bağla; başlangıç sorusunu, takip sorularını, yorumları ve puanları gerçek model üretsin. Yalnız openrouter/free yönlendiricisi ve sıfır fiyat tavanları kullanılır. Kota/hata durumunda ücretli modele otomatik geçiş yoktur. Anahtar şifreli cihaz kaydında, ilerleme ve taşınabilir yedekten ayrı tutulur. Veri gönderimi açık izin ve bu modun seçilmesini gerektirir.

          Kişisel OpenRouter hesabı/anahtarı gerekir; anahtarı sohbete veya başkasına gönderme. Uygulamada anahtar sayfası düğmesi vardır; kredi satın alman gerekmez. Ücretsiz servis kotası ve yoğunluk sınırları vardır. Gerçek sağlayıcı üzerinden Türkçe/mizah kalitesi ve 2–3 saniye süresi henüz doğrulanmadı. Yerel üç modelin tek sentetik alarm denemesi istenen kaliteyi karşılamadı; bunlar yeni model diye sunulmadı. Hızlı oyun çevrimdışı, Cihazda AI deneysel olarak korunur.

          En çok iki ücretsiz deneme ve ortak 15 saniyelik süre sınırı. Kota, kimlik ve ücret bilgisi uyuşmazlığında otomatik yeniden deneme yoktur. Geçersiz/uzun/tekrar soru, eksik JSON ve puan talimatı ödüllendirilmez. Başarısız cevap için puan uydurulmaz; kullanıcı aynı hikâyeyi/cevabı koruyarak açıkça Hızlı oyuna geçebilir. API hata ve fallback testleri kontrollü fixture testleridir; gerçek servis kalitesi onayı değildir.

          v0.8.0 (kod 13) ve v0.8.1 (kod 14) aynı koşuda aynı anahtarla üretilir; 0.8.0 → Ayarlar → Güncellemeleri kontrol et → indir/doğrula → kur akışı kullanılabilir. ARM64 Android 8+, Google Play Hizmetleri gerekmez. Kalıcı imza ayarlı değilse bu ikili test imzalıdır; eski 0.7/0.6/0.5 test kurulumlarıyla imza farklıdır. Eski uygulamayı kaldırmadan önce parolalı yedek oluştur. İmza kontrolü atlanmaz veya uygulama otomatik kaldırılmaz. Fiziksel A55/Huawei/Xiaomi doğrulaması henüz yoktur.
          NOTES
          for tag in v0.8.0-alpha v0.8.1-alpha; do
            gh release create "$tag" apk/"$tag"/* --repo "$REPO" --title "LANU $tag · OTA test sürümü" --notes-file notes.md --prerelease --target "$COMMIT"
          done
      - name: Verify public APK downloads after publication
        run: python3 scripts/verify_published_downloads.py
