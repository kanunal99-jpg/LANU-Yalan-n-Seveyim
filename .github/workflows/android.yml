name: Android checks and APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LANU_STORE_PASSWORD: ${{ secrets.LANU_STORE_PASSWORD }}
      LANU_KEY_ALIAS: ${{ secrets.LANU_KEY_ALIAS }}
      LANU_KEY_PASSWORD: ${{ secrets.LANU_KEY_PASSWORD }}
      LANU_CERT_SHA256: ${{ secrets.LANU_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare existing permanent key when configured
        env:
          LANU_KEYSTORE_BASE64: ${{ secrets.LANU_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_ci_signing.py
      - name: Exercise missing, partial and mismatched signing safeguards
        run: python3 scripts/signing_guard_smoke.py
      - name: Test, lint and build
        run: ./gradlew -Planu.requireProductionSigning=${LANU_REQUIRE_SIGNING:-false} testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Build same-signature OTA pair
        run: |
          mkdir -p release-packages/v0.6.0-alpha release-packages/v0.6.1-alpha
          cp app/build/outputs/apk/debug/app-debug.apk release-packages/v0.6.0-alpha/LANU-Yalanini-Seveyim-v0.6.0-alpha-arm64-test.apk
          ./gradlew -Planu.requireProductionSigning=${LANU_REQUIRE_SIGNING:-false} -Planu.versionCode=10 -Planu.versionName=0.6.1-alpha assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk release-packages/v0.6.1-alpha/LANU-Yalanini-Seveyim-v0.6.1-alpha-arm64-test.apk
          python3 scripts/release_packages.py
          for apk in release-packages/*/*.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"; done
      - uses: actions/upload-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: release-packages/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/story-quality
            app/build/reports/ai-quality
            app/build/reports/signing-guard
            app/build/test-results
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AOSP UI smoke without Google services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test -z "$(adb shell pm path com.google.android.gms | tr -d '\r')"
            adb shell settings put system font_scale 1.3
            bash scripts/ota_emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-ui-smoke-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/reports/ota-upgrade
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-alpha]'))
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: apk
      - name: Publish verified base and OTA update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          LANU 0.6 alpha: kullanıcının Mars → Hatay → New York örneğindeki iç içe soru ve aynı espri döngüsü düzeltildi. Yolculuk konusu, sonradan eklenen yer, yemek, gerekçe ve plan değişikliği birlikte takip edilir. Mars gibi kurgusal başlangıç doğrudan yasaklanmaz; rota ve hikâyenin iç bağlantıları sorgulanır. Açıklanan geçiş kabul edilir; yeni yer eklemek önceki açıkları silmez. Kaçamak cevapta önceki soruyu alıntı içine alıp tekrar etmek yerine açık kalan başlık kısa ve doğrudan sorulur.

          Bu iyileştirmeler Hızlı oyunun açıkça etiketlenmiş yerel kurallarıdır. Serbest generatif AI, insan düzeyinde Türk mizahı veya her cümleyi anlama iddiası değildir. Cihazda AI deneysel kalır; mevcut modelde kalite ve 2–3 saniyelik hız hedefi sağlanmış değildir. Referans uygulamanın mağaza açıklaması incelendi; uygulaması oynanarak kopyalanmadı.

          v0.6.0 ve v0.6.1 aynı koşuda aynı anahtarla üretilir. OTA için v0.6.0 → Ayarlar → Güncellemeleri kontrol et → indir/doğrula → kur yoluyla v0.6.1'e geçilebilir. Hash/boyut/paket/sürüm/kurulu imza kontrolleri korunur. AOSP emülatörde gerçek yerinde yükseltme ve şifreli kayıt korunması sınanır. ARM64 Android 8+, Google Play Hizmetleri gerekmez. Fiziksel A55/Huawei/Xiaomi doğrulaması henüz yoktur.

          Kalıcı imza secret'ları ayarlı değilse bu iki APK test anahtarı kullanır; önceki 0.5/0.4 test kurulumlarının imzasıyla eşleşmez. Eski uygulamayı kaldırmak ilerlemeyi siler: önce Ayarlar'dan parolalı yedek oluştur. Güncelleme hiçbir zaman imza kontrolünü atlamaz veya uygulamayı kendisi kaldırmaz. Kalıcı imza kurulumu docs/STABLE_SIGNING.md dosyasındadır.
          NOTES
          for tag in v0.6.0-alpha v0.6.1-alpha; do
            gh release create "$tag" apk/"$tag"/* --repo "$REPO" --title "LANU $tag · OTA test sürümü" --notes-file notes.md --prerelease --target "$COMMIT"
          done
      - name: Verify public APK downloads after publication
        run: python3 scripts/verify_published_downloads.py
