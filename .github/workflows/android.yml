name: Android checks and APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/story-quality
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AOSP UI smoke without Google services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test -z "$(adb shell pm path com.google.android.gms | tr -d '\r')"
            adb shell settings put system font_scale 1.3
            ./gradlew -Planu.uiSmoke=true connectedDebugAndroidTest --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-ui-smoke-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-alpha]'))
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LANU-Yalanini-Seveyim-test-apk
          path: apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.3.0-alpha' }}
          COMMIT: ${{ github.sha }}
        run: |
          mv apk/app-debug.apk apk/LANU-Yalanini-Seveyim-${TAG}-arm64-test.apk
          sha256sum apk/*.apk > apk/SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Cevaba özel sorgulama: telefon/şarj, alarm, trafik, araç arızası, ödev, bağlantı, buluşma ve diğer hikâye ayrıntıları farklı soru ve esprilere gider. 5 zorluk bandı; önceki ifadelerle saat, süre, araç ve iletişim sırası karşılaştırılır. Açıklanan bir boşluk tekrar suçlama yapılmaz; sorulan açı yeniden başlatmadan sonra da hatırlanır.

          Hızlı oyun, bu ayrıntıları Kotlin kurallarıyla ele alır; dil modeli değildir. Gerçek Qwen3.5 4B seçeneğinde modele oyuncunun kendi ifadelerinden çıkarılan vaka notları ve önceki sorular verilir; genel geçer yorumlardan kaçınması istenir. Model çıktısı yine yanılabilir. İlk soru hemen açılır, AI yükleme + üretim bütçesi 30 saniyedir; gerçek AI için 2–3 saniye garantisi verilmez.

          Beş soruluk gerçek şifreli kayıt akışı, büyük yazı/klavyede düğme erişimi ve her tur için 3 saniyelik Hızlı oyun kapısı yayından önce test edilir. Soru özgüllüğü ve çelişki düzeltmeleri ayrıca sentetik davranış testleriyle sınanır. Fiziksel telefon süreleri ayrı ölçülmelidir. API, sunucu, üyelik veya abonelik ücreti yok.

          Samsung, Huawei, Xiaomi ve diğer ARM64 Android 8+ cihazları için aynı standart Android yolu kullanılır. Google Play Hizmetleri gerekmez. AI modu için 8 GB RAM önerilir. Fiziksel cihazlar üzerinde AI hız/kalite doğrulaması yapılmadı.

          Bu APK debug/test imzalıdır. Kalıcı üretim imzası yapılandırılmadığı için sonraki test APK'larına yerinde güncelleme garantisi yoktur. Üretim sürümü ve OTA henüz hazır değildir.
          NOTES
          gh release create "$TAG" apk/* --repo "$REPO" --title "LANU $TAG · Android test sürümü" --notes-file notes.md --prerelease --target "$COMMIT"
