name: Native AI diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/premium-ota-20261023, codex/claim-review-20261023]
    paths:
      - 'app/src/main/cpp/**'
      - 'app/src/main/java/com/lanu/yalan/ai/**'
      - 'app/src/main/java/com/lanu/yalan/domain/**'
      - 'app/src/main/assets/system_prompt.txt'
      - 'app/src/test/java/com/lanu/yalan/ai/**'
      - 'scripts/dialogue_smoke.py'
      - 'scripts/native_invariant_smoke.py'
      - 'scripts/download_ai_benchmark_model.py'
permissions:
  contents: read
concurrency:
  group: native-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Export exact production prompts and grammar
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew -Planu.uiSmoke=true testDebugUnitTest --tests com.lanu.yalan.ai.AiFixtureExportTest --max-workers=2
          ./gradlew --stop
      - name: Build the shared native host probe
        run: |
          cmake -S app/src/main/cpp -B "$RUNNER_TEMP/lanu-ai/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/lanu-ai/build" --target lanu-ai-probe -j 4
      - name: Download and verify the pinned model
        run: python3 scripts/download_ai_benchmark_model.py "$RUNNER_TEMP/lanu-ai/model.gguf"
      - name: Record CI hardware
        run: |
          uname -a > app/build/reports/ai-quality/runtime.txt
          lscpu >> app/build/reports/ai-quality/runtime.txt
          free -m >> app/build/reports/ai-quality/runtime.txt
      - name: Measure fifteen real model outputs including absurdity and repair
        id: dialogue
        continue-on-error: true
        run: python3 scripts/dialogue_smoke.py --probe "$RUNNER_TEMP/lanu-ai/build/lanu-ai-probe" --model "$RUNNER_TEMP/lanu-ai/model.gguf" --fixtures app/build/reports/ai-quality/fixtures.json --output app/build/reports/ai-quality/dialogue-native-results.json --threads 4 --timeout 120
      - name: Verify grammar rejection and context-error recovery
        if: ${{ !cancelled() && steps.dialogue.outcome != 'skipped' }}
        run: python3 scripts/native_invariant_smoke.py --probe "$RUNNER_TEMP/lanu-ai/build/lanu-ai-probe" --model "$RUNNER_TEMP/lanu-ai/model.gguf" --output app/build/reports/ai-quality/native-ai-invariants.json
      - name: Explain diagnostic status
        if: always()
        env:
          DIALOGUE_OUTCOME: ${{ steps.dialogue.outcome }}
        run: |
          echo "Native model diagnostic outcome: $DIALOGUE_OUTCOME. A completed job is not Turkish/humor quality approval." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DIALOGUE_OUTCOME" != success ]; then echo '::warning::Native AI checks failed or did not complete. Review raw model outputs; AI remains experimental.'; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ai-diagnostics
          path: app/build/reports/ai-quality
